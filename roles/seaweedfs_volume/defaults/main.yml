---
# `weed volume` on one box. Packed volume files: a box holds a few hundred files however many objects it stores, which is the point
# against the provider's file quota (soft limit 500 files per GiB, every file counts). The master, the filer and the S3 gateway run
# elsewhere; this role only installs and configures the volume server and does not start it (seaweedfs_volume_start does).
seaweed_version: "4.51"
seaweed_download_url: "https://github.com/seaweedfs/seaweedfs/releases/download/{{ seaweed_version }}/linux_amd64.tar.gz"
seaweed_sha256: "c03be37416a8ee672c77766e20b22a4e1430744c3af2668599a4b6eeaec14cee"
seaweed_base_dir: "{{ ansible_facts['user_dir'] }}/cold"
seaweed_bin_dir: "{{ seaweed_base_dir }}/bin"
seaweed_data_dir: "{{ seaweed_base_dir }}/data/seaweed"
seaweed_log_dir: "{{ seaweed_base_dir }}/log"
seaweed_tls_dir: "{{ seaweed_base_dir }}/tls"             # key.pem, cert.pem, ca.pem (issued by the cpmd tls role)

# Ports must be ones the provider assigned to the account (facts: ports.assigned_files); nothing else is reachable.
seaweed_http_port: 0                                     # HTTPS of the volume server: a port the provider assigned to the account; 0 stops the play
seaweed_grpc_port: 0                                     # host variable, an unused assigned port; 0 stops the play
seaweed_public_ip: "{{ ansible_host }}"
seaweed_master: ""                                       # host:httpPort of the master; its gRPC port is httpPort + 10000
seaweed_data_center: dc1
seaweed_rack: "{{ inventory_hostname }}"                 # one rack per box: replication 010 = two copies on different racks
seaweed_max_volumes: 40
seaweed_min_free_space: 5GiB
seaweed_index: memory                                    # one .idx file per volume (leveldb would add a directory of files each)
seaweed_compaction_mbps: 10
seaweed_idle_timeout: 60
seaweed_tls_names: ["{{ cpmd_label | default(inventory_hostname) }}", localhost]   # add the public names of the box
seaweed_ca_cert_file: ""                                 # path of the CA certificate on the controller; required
seaweed_ca_key_sops_file: ""                             # sops file holding the CA key; required
seaweed_ca_key_sops_key: ca_key
seaweed_leaf_days: 825
seaweed_tls_ips: ["{{ ansible_host }}", "127.0.0.1"]
seaweedfs_volume_start: false

# Optional master on this box (a single master for a trial; production wants a raft of three on three boxes). Two more assigned ports.
seaweed_master_enable: false
seaweed_master_http_port: 0
seaweed_master_grpc_port: 0
seaweed_inventory_group: swfs       # group whose members may use the master HTTP admin API (whiteList)
# Raft election timeout of the masters (weed default 10 s; followers wait a random 1-2x of it before they stand for election). On shared hosts a stalled
# fsync or a CPU-starved process costs seconds; a follower that misses the leader's heartbeats for 10 s starts an election with a higher term and the healthy
# leader steps down (no pre-vote), and every step-down unregisters the volume servers that were on the old leader's streams. "" keeps the weed default.
seaweed_master_election_timeout: ""
# Master HTTP admin handlers (/col/delete, /vol/grow, /vol/vacuum, /dir/assign, /dir/status ...) are open to everyone unless -whiteList is set.
# Everything else (volume, filer, S3, health) is mTLS or signed; the cluster itself talks gRPC to the masters.
seaweed_master_whitelist: "{{ (groups[seaweed_inventory_group] | map('extract', hostvars, 'ansible_host') | list + ['127.0.0.1']) | join(',') }}"
seaweed_jwt_sops_file: ""           # NOTE: a change of the JWT key must reach master AND volume on ALL boxes within minutes (-e service_serial=7 or back-to-back); while keys
# differ, writes fail. sops file with the volume-write JWT signing key; empty = no JWT (volume writes then rely on mTLS only)
seaweed_jwt_sops_key: jwt_signing_key
seaweed_master_peers: ""            # empty = single master
seaweed_volume_size_limit_mb: 1024
seaweed_default_replication: "010"  # two copies on different racks

# Master maintenance script and cadence (default: no EC). An erasure coding setup overrides seaweed_master_scripts.
seaweed_master_sleep_minutes: 17
seaweed_master_scripts: |
  lock
  volume.deleteEmpty -quietFor=24h -apply
  volume.balance -apply
  volume.fix.replication -apply
  s3.clean.uploads -timeAgo=24h
  unlock

# Optional filer with its S3 gateway on this box (for example three filers with local leveldb2 stores that aggregate each other's metadata).
seaweed_filer_enable: false
seaweed_filer_http_port: 0
seaweed_filer_grpc_port: 0
seaweed_s3_https_port: 0
seaweed_s3_grpc_port: 0
seaweed_s3_sops_file: ""            # sops file with the S3 identity
seaweed_s3_access_sops_key: ""
seaweed_s3_secret_sops_key: ""
# Optional second identity `backup` (actions Read and List only: it can neither write nor delete): for the nightly pull of a backup host.
seaweed_s3_backup_sops_file: ""
seaweed_s3_backup_access_sops_key: access_key
seaweed_s3_backup_secret_sops_key: secret_key

# Memory caps and OOM order on a box that runs everything (cgroup v1: no enforced MemoryMax in user units). Kill order: S3 gateway, filer, volume, master last.
seaweed_filer_block_cache_mb: 4
seaweed_filer_write_buffer_mb: 4
# One S3 identity per application bucket, scoped to that bucket only (Read, Write, List on it): a list of
#   {name, bucket, sops_file, access_sops_key, secret_sops_key}; the secrets come from sops on the controller.
seaweed_s3_app_identities: []
# Owner of the application buckets the role creates: the admin identity of s3.json (the first one, `jfs`).
seaweed_s3_bucket_owner: jfs
seaweed_s3_cache_mb: 0
seaweed_s3_reader_cache_mb: 8
seaweed_s3_upload_limit_mb: 32
seaweed_s3_upload_files: 2
# Volume server in-flight request budgets in MiB (0 = weed default, 256 each). Lowered on boxes where the whole account has 1.25 GiB.
seaweed_volume_upload_limit_mb: 0
seaweed_volume_download_limit_mb: 0
seaweed_oom_s3: 900
seaweed_oom_filer: 600
seaweed_oom_volume: 300
seaweed_oom_master: 0
# Go soft memory limits (GOMEMLIMIT): the runtime garbage-collects harder instead of growing past them (cgroup v1 has no enforced limit for user units)
seaweed_gomemlimit_s3: 250MiB
seaweed_gomemlimit_filer: 300MiB
seaweed_gomemlimit_volume: 250MiB
seaweed_gomemlimit_master: 120MiB

# swfs-filerwatch (self-fence of a filer that is cut off from most peers). Off by default.
seaweed_filerwatch_enable: false
seaweed_filerwatch_mode: observe     # observe = log WOULD FENCE/UNFENCE only; enforce = stop and start the units
seaweed_filerwatch_interval: 10
seaweed_filerwatch_fence_seconds: 60
seaweed_filerwatch_unfence_seconds: 300
# comma separated host:grpcport of ALL filers and of the masters (set in the group, built from the hosts' variables)
seaweed_filerwatch_filers: ""
seaweed_filerwatch_masters: ""

# swfs-health (gatus polls GET http://<box>:<port>/health.json). The cluster-wide checks run only where seaweed_health_cluster is true.
seaweed_health_enable: false
seaweed_health_port: 0
seaweed_health_cluster: false
seaweed_health_peer_s3: ""      # comma separated https://host:port of every filer's S3 gateway

# swfs-maint (box-local EC scrub and cleanup, files/swfs-maint.sh): a systemd user timer on the box, no ssh, no outside driver. One box
# per night: the group sets seaweed_maint_index (0..boxes-1) and the timer fires on the weekday of that index (index 0 = Tuesday 02:00 ... index 6 = Monday 02:00,
# the night of Monday evening to Tuesday as before). Dry-run unless seaweed_maint_apply.
seaweed_maint_enable: false
seaweed_maint_apply: false
seaweed_maint_index: -1
seaweed_maint_boxes: 7
seaweed_maint_threshold: 0.3
seaweed_maint_masters: "{{ seaweed_master }}"
seaweed_maint_time: "02:00:00"

# swfs-master-guard (2026-11-13): a master that is `active` for systemd and silent on /cluster/status is restarted by its own box (files/swfs-master-guard.py:
# SIGQUIT so the goroutine dump reaches master.log, then Restart=always). The master that hung on 2026-11-12 pinned all volume servers for ten hours. Acts only
# while enough OTHER masters answer (len//2 + 2, so a quorum is left and one more may be down), at most seaweed_master_guard_max_restarts per 24 h, one per cooldown.
seaweed_master_guard_enable: false
seaweed_master_guard_act: true            # false = log the decision, restart nothing
seaweed_master_guard_down_s: 180          # silence before it may act
seaweed_master_guard_stagger_s: 20        # plus this per index in the master list
seaweed_master_guard_cooldown_s: 1800
seaweed_master_guard_max_restarts: 3

# swfs-docker-guard: the provider's root cron starts rootless Docker in the account (dockerEnabled=true, 27-103 MiB of the 1250 MiB limit). A user path unit
# (inotify on the runtime files, no polling) starts a one-shot that stops exactly that uid's Docker process tree. Nothing of the provider's install is touched.
# act=false only logs what it would stop (OBSERVE). The provider's 5-minute cron starts Docker again until the account setting is switched off.
seaweed_docker_guard_enable: false
seaweed_docker_guard_act: false

# Hard cap on the data segment of each weed process (RLIMIT_DATA via LimitDATA=, unprivileged, no cgroup needed). It is a RUNAWAY STOP, never an RSS cap: a Go process
# reserves 2.3-3x its resident size in VmData (cld-6, 2026-11-17: master 101/36, volume 344/100, filer 473/190, s3 183/75 MiB VmData/RSS). When the limit is hit the Go runtime
# aborts and systemd restarts the unit. Empty = no limit. Values are measured VmData + 20-25 %.
seaweed_limitdata_master: ""
seaweed_limitdata_volume: ""
seaweed_limitdata_filer: ""
seaweed_limitdata_s3: ""

# The ONE declared RAM budget per unit (MiB), read by swfs-health (swfs_health_unit_rss_mib / _budget_mib) and nothing else decides it. Aim of the account: ram_ws never above 900 MiB.
seaweed_unit_budgets_mib:
  weed-master: 80
  weed-volume: 200
  weed-filer: 200
  weed-s3: 140
  otelcol: 30
  node_exporter: 15
  swfs-health: 30
  radar: 20
  panel: 0
  docker: 0
seaweed_unit_budgets_file: "{{ seaweed_base_dir }}/etc/unit-budgets.json"

# The provider's rootless Docker: besides stopping it (swfs-docker-guard), make dockerd refuse to start at all by putting a text line (invalid JSON) into the account's own
# ~/.config/docker/daemon.json, so a cron start fails at config parse in milliseconds. The provider's original is kept next to it as daemon.json.provider. Off by default.
seaweed_docker_neutralize_daemon_json: false
