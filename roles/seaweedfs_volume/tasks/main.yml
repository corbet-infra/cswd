---
# Modes (decision 2026-10-28): the shop re-chmods the whole account home from time to time (a root job, their 0770 default), so directory,
# unit and tarball modes are not managed here; they protect nothing behind a private per-user group and a closed home. Only files that hold a
# credential keep an explicit 0600 (security.toml, master.toml, filer.toml, s3.json, the TLS key); `swfs-tool` asserts at every roll that
# none of them is group- or world-readable and that the home has other=0.
# Installs and configures `weed volume` on one box. Starting is a separate switch (seaweedfs_volume_start).
- name: Learn the account (user directory, uid)
  ansible.builtin.setup:
    gather_subset: [min]
    filter: ansible_user_*
  when: ansible_facts['user_dir'] is not defined

- name: Required settings
  ansible.builtin.assert:
    that:
      - seaweed_master | length > 0
      - seaweed_grpc_port | int > 0
      - seaweed_http_port | int > 0
      - seaweed_ca_cert_file | length > 0
      - seaweed_ca_key_sops_file | length > 0
      - not seaweed_master_enable or (seaweed_master_http_port | int > 0 and seaweed_master_grpc_port | int > 0)
    fail_msg: "seaweed_master, seaweed_http_port, the host variable seaweed_grpc_port (assigned, unused ports) and seaweed_ca_cert_file / seaweed_ca_key_sops_file must be set"
    quiet: true

- name: Directories (private)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ seaweed_base_dir }}"
    - "{{ seaweed_bin_dir }}"
    - "{{ seaweed_base_dir }}/dl"
    - "{{ seaweed_tls_dir }}"
    - "{{ seaweed_data_dir }}"
    - "{{ seaweed_log_dir }}"
    - "{{ ansible_facts['user_dir'] }}/.seaweedfs"
    - "{{ ansible_facts['user_dir'] }}/.config/systemd/user"

- name: Leaf certificate from your CA (the cpmd tls role; key made on the box)
  ansible.builtin.include_role:
    name: corbet.cpmd.tls
  vars:
    tls_dir: "{{ seaweed_tls_dir }}"
    tls_names: "{{ seaweed_tls_names }}"
    tls_ips: "{{ seaweed_tls_ips }}"
    tls_ca_cert_file: "{{ seaweed_ca_cert_file }}"
    tls_ca_key_sops_file: "{{ seaweed_ca_key_sops_file }}"
    tls_ca_key_sops_key: "{{ seaweed_ca_key_sops_key }}"
    tls_leaf_days: "{{ seaweed_leaf_days }}"

- name: Binary present
  ansible.builtin.stat:
    path: "{{ seaweed_bin_dir }}/weed-{{ seaweed_version }}/weed"
  register: seaweed_bin_stat

- name: Download the pinned release (sha256 checked by the module)
  ansible.builtin.get_url:
    url: "{{ seaweed_download_url }}"
    dest: "{{ seaweed_base_dir }}/dl/weed-{{ seaweed_version }}.tar.gz"
    checksum: "sha256:{{ seaweed_sha256 }}"
  when: not seaweed_bin_stat.stat.exists

- name: Directory of this version
  ansible.builtin.file:
    path: "{{ seaweed_bin_dir }}/weed-{{ seaweed_version }}"
    state: directory

- name: Unpack
  ansible.builtin.unarchive:
    src: "{{ seaweed_base_dir }}/dl/weed-{{ seaweed_version }}.tar.gz"
    dest: "{{ seaweed_bin_dir }}/weed-{{ seaweed_version }}"
    remote_src: true
    creates: "{{ seaweed_bin_dir }}/weed-{{ seaweed_version }}/weed"
  when: not seaweed_bin_stat.stat.exists and not ansible_check_mode

- name: Archive no longer needed (it counts against the file quota and the disk)
  ansible.builtin.file:
    path: "{{ seaweed_base_dir }}/dl/weed-{{ seaweed_version }}.tar.gz"
    state: absent

- name: security.toml
  ansible.builtin.template:
    src: security.toml.j2
    dest: "{{ ansible_facts['user_dir'] }}/.seaweedfs/security.toml"
    mode: "0600"
  no_log: true   # carries the JWT signing key; also keeps it out of --diff
  register: seaweed_sec

- name: Unit
  ansible.builtin.template:
    src: seaweed-volume.service.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/seaweed-volume.service"
  register: seaweed_unit

- name: Master stopped and disabled (this box hosts none)
  ansible.builtin.systemd_service:
    name: seaweed-master.service
    enabled: false
    state: stopped
    scope: user
  failed_when: false
  when: not (seaweed_master_enable | bool) and (seaweedfs_volume_start | bool)
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"

- name: Master (this box hosts one)
  when: seaweed_master_enable | bool
  block:
    - name: Master data directory
      ansible.builtin.file:
        path: "{{ seaweed_base_dir }}/data/seaweed-master"
        state: directory
    - name: master.toml
      ansible.builtin.template:
        src: master.toml.j2
        dest: "{{ ansible_facts['user_dir'] }}/.seaweedfs/master.toml"
        mode: "0600"
      register: seaweed_mtoml
    - name: Master unit
      ansible.builtin.template:
        src: seaweed-master.service.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/seaweed-master.service"
      register: seaweed_munit
    - name: Master enabled and (on request) started before the volume servers
      ansible.builtin.systemd_service:
        name: seaweed-master.service
        daemon_reload: true
        enabled: true
        state: "{{ ('restarted' if (seaweed_munit.changed or seaweed_sec.changed or seaweed_mtoml.changed) else 'started') if seaweedfs_volume_start else omit }}"
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"

- name: Reload, enable and (on request) start
  ansible.builtin.systemd_service:
    name: seaweed-volume.service
    daemon_reload: true
    enabled: true
    state: "{{ ('restarted' if (seaweed_unit.changed or seaweed_sec.changed) else 'started') if seaweedfs_volume_start else omit }}"
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"

- name: Filer with S3 gateway (this box hosts one)
  when: seaweed_filer_enable
  block:
    - name: Filer data directory
      ansible.builtin.file:
        path: "{{ seaweed_base_dir }}/data/seaweed-filer/ldb"
        state: directory
    - name: filer.toml
      ansible.builtin.template:
        src: filer.toml.j2
        dest: "{{ ansible_facts['user_dir'] }}/.seaweedfs/filer.toml"
        mode: "0600"
      register: seaweed_ftoml
    - name: S3 identities (secrets from sops on the controller, file 0600 on the box)
      ansible.builtin.template:
        src: s3.json.j2
        dest: "{{ ansible_facts['user_dir'] }}/.seaweedfs/s3.json"
        mode: "0600"
      no_log: true
      register: seaweed_s3json
    - name: Filer unit
      ansible.builtin.template:
        src: seaweed-filer.service.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/seaweed-filer.service"
      register: seaweed_funit
    - name: Filer enabled and (on request) started
      ansible.builtin.systemd_service:
        name: seaweed-filer.service
        daemon_reload: true
        enabled: true
        state: "{{ ('restarted' if (seaweed_funit.changed or seaweed_sec.changed or seaweed_ftoml.changed) else 'started') if seaweedfs_volume_start else omit }}"
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
    - name: S3 gateway unit
      ansible.builtin.template:
        src: seaweed-s3.service.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/seaweed-s3.service"
      register: seaweed_s3unit
    - name: S3 gateway enabled and (on request) started
      ansible.builtin.systemd_service:
        name: seaweed-s3.service
        daemon_reload: true
        enabled: true
        state: "{{ ('restarted' if (seaweed_s3unit.changed or seaweed_sec.changed or seaweed_s3json.changed) else 'started') if seaweedfs_volume_start else omit }}"
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
    - name: Report the S3 gateway restart (a changed s3.json, unit or secret restarts it when seaweedfs_volume_start is true; swfs-tool prints this line)
      ansible.builtin.debug:
        msg: "restarted: s3"
      when: seaweedfs_volume_start and (seaweed_s3unit.changed or seaweed_sec.changed or seaweed_s3json.changed)

- name: swfs-filerwatch (self-fence of this box's filer and S3 gateway when it is cut off from most peers)
  when: (seaweed_filerwatch_enable | bool) and (seaweed_filer_enable | bool)
  block:
    - name: Status and event directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ seaweed_base_dir }}/status"
        - "{{ ansible_facts['user_dir'] }}/.local/state/crfs"
    - name: swfs-filerwatch script
      ansible.builtin.copy:
        src: swfs-filerwatch.py
        dest: "{{ seaweed_base_dir }}/bin/swfs-filerwatch.py"
        mode: "0700"
      register: seaweed_fw_script
    - name: swfs-filerwatch unit
      ansible.builtin.template:
        src: swfs-filerwatch.service.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/swfs-filerwatch.service"
      register: seaweed_fw_unit
    - name: swfs-filerwatch enabled, restarted when its script or unit changed
      ansible.builtin.systemd_service:
        name: swfs-filerwatch.service
        daemon_reload: true
        enabled: true
        state: "{{ ('restarted' if (seaweed_fw_script is changed or seaweed_fw_unit is changed) else 'started') if (seaweedfs_volume_start | bool) else omit }}"
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"

- name: swfs-health (health JSON for gatus)
  when: seaweed_health_enable | bool
  block:
    - name: swfs-health script
      ansible.builtin.copy:
        src: swfs-health.py
        dest: "{{ seaweed_base_dir }}/bin/swfs-health.py"
        mode: "0700"
      register: seaweed_h_script
    - name: swfs-health unit
      ansible.builtin.template:
        src: swfs-health.service.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/swfs-health.service"
      register: seaweed_h_unit
    - name: swfs-health enabled, restarted when its script or unit changed
      ansible.builtin.systemd_service:
        name: swfs-health.service
        daemon_reload: true
        enabled: true
        state: "{{ ('restarted' if (seaweed_h_script is changed or seaweed_h_unit is changed) else 'started') if (seaweedfs_volume_start | bool) else omit }}"
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"

- name: swfs-maint (box-local EC scrub and cleanup on a weekly night of this box)
  when: seaweed_maint_enable | bool
  vars:
    _swfs_maint_weekday: "{{ ['Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun', 'Mon'][seaweed_maint_index | int] }}"
    _swfs_maint_args: >-
      --weed {{ seaweed_bin_dir }}/weed-{{ seaweed_version }}/weed --masters {{ seaweed_maint_masters }}
      --node {{ seaweed_public_ip }}:{{ seaweed_http_port }}.{{ seaweed_grpc_port }} --index {{ seaweed_maint_index }}
      --boxes {{ seaweed_maint_boxes }} --data {{ seaweed_data_dir }} --service seaweed-volume.service{{ ' --apply' if seaweed_maint_apply | bool else '' }}
  block:
    - name: swfs-maint index is a box of the ring
      ansible.builtin.assert:
        that: (seaweed_maint_index | int) >= 0 and (seaweed_maint_index | int) < 7
    - name: swfs-maint script
      ansible.builtin.copy:
        src: swfs-maint.sh
        dest: "{{ seaweed_base_dir }}/bin/swfs-maint.sh"
        mode: "0700"
    - name: swfs-maint service
      ansible.builtin.template:
        src: swfs-maint.service.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/swfs-maint.service"
    - name: swfs-maint timer
      ansible.builtin.template:
        src: swfs-maint.timer.j2
        dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/swfs-maint.timer"
    - name: swfs-maint timer enabled and running (the service itself is only ever started by the timer)
      ansible.builtin.systemd_service:
        name: swfs-maint.timer
        daemon_reload: true
        enabled: true
        state: started
        scope: user
      # in check mode the timer file of a first install does not exist yet
      ignore_errors: "{{ ansible_check_mode }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"

- name: Application buckets
  ansible.builtin.include_tasks: buckets.yml
  when: (seaweed_filer_enable | bool) and (seaweedfs_volume_start | bool) and (seaweed_s3_app_identities | length > 0)

